<!DOCTYPE html>
<html>

<head>
    <title>Demo PlanarView</title>

    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="css/example.css">
    <link rel="stylesheet" type="text/css" href="css/LoadingScreen.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div id="description">
        <p><b>Point Cloud information</b></p>
        <ul id="info"></ul>
        <p><b>WFS information</b></p>
        <ul id="infoBuilding"></ul>
        <p><b>URBS information</b></p>
        <ul id="urbsInfo"></ul>
    </div>
    <div id="viewerDiv"></div>

    <script type="importmap">
            {
                "imports": {
                    "itowns": "../dist/itowns.js",
                    "debug": "../dist/debug.js",
                    "dat": "https://unpkg.com/dat.gui@0.7.9/build/dat.gui.module.js",
                    "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/",
                    "camera-controls": "https://unpkg.com/camera-controls@2.7.2/dist/camera-controls.module.js",
                    "lil": "https://unpkg.com/lil-gui@0.19.2/dist/lil-gui.esm.min.js",
                    "geotiff": "https://esm.sh/geotiff@2.1.3"
                }
            }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as itowns from 'itowns';
        import CameraControls from 'camera-controls';
        import GuiTools from "./jsm/GUI/GuiTools.js";
        import COGSource from "./jsm/plugins/COGSource.js";
        import lil from 'lil';

        var viewerDiv;
        var debugGui;
        var view;
        var controls;
        var clock = new THREE.Clock();
        var scene = new THREE.Scene();
        var color = new THREE.Color();
        var debugMenu;
        var viewExtent;
        var pivot;
        var raycaster = new THREE.Raycaster();

        CameraControls.install({ THREE: THREE });

        viewerDiv = document.getElementById('viewerDiv');
        viewerDiv.style.display = 'block';

        debugGui = new lil();

        const IMAGE_SOURCE_TYPE = {
            SATELLITE: 0,
            IGN_PLANV2: 1
        };

        const settings = {
            imageSourceType: IMAGE_SOURCE_TYPE.SATELLITE,
            omniscaleKey: "",
            urbsKey: "",
            opacity: 1,
            dwgVisibility: true,
            showWFSProperties: true
        }

        // Define crs projection that we will use (taken from https://epsg.io/3946, Proj4js section)
        itowns.CRS.defs('EPSG:3947', '+proj=lcc +lat_0=47 +lon_0=3 +lat_1=46.25 +lat_2=47.75 +x_0=1700000 +y_0=6200000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs +type=crs');
        itowns.CRS.defs('EPSG:2154', '+proj=lcc +lat_1=49 +lat_2=44 +lat_0=46.5 +lon_0=3 +x_0=700000 +y_0=6600000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs');

        let extentSize = 40;
        const viewExtentEPSG = "EPSG:3947";
        const orthoEPSG = viewExtentEPSG; // "EPSG:3947";
        const centerCoord = new itowns.Coordinates(viewExtentEPSG,  1856383.088, 6226918.406, 213.44);

        var customRenderer = createRenderer();
        var rendererSize = customRenderer.getSize(new THREE.Vector2());
        var customCamera = new THREE.PerspectiveCamera(60, rendererSize.width / rendererSize.height, 0.1, 1000);
        customCamera.up.set(0, 1, 0);
        scene.add(customCamera);

        let layerOrtho;
        let layerDEM;
        let layerGeoTiff;

        createLights();
        controls = new CameraControls(customCamera, viewerDiv);
        loadView();
        animate();

        function animate() {
            const delta = clock.getDelta();
            const updated = controls.update(delta);
            // if (updated) {
            view.notifyChange(customCamera);
            // }
            requestAnimationFrame(animate);
        }

        function createLights() {
            const directionalLight1 = new THREE.DirectionalLight(0xffeeff, 0.8);
            directionalLight1.position.set(1, 1, 1);
            directionalLight1.layers.enableAll();
            scene.add(directionalLight1);

            const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight2.position.set(-1, 0.5, -1);
            directionalLight2.layers.enableAll();
            scene.add(directionalLight2);

            const ambientLight = new THREE.AmbientLight(0xffffee, 0.25);
            ambientLight.layers.enableAll();
            scene.add(ambientLight);
        }

        function createRenderer() {
            const renderer = new THREE.WebGLRenderer({
                alpha: true,
                antialias: true,
                powerPreference: "high-performance",
                preserveDrawingBuffer: true
            });
            renderer.setSize(viewerDiv.clientWidth, viewerDiv.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.info.autoReset = false;

            // Improve color rendering
            renderer.localClippingEnabled = true;
            renderer.setClearColor(0x000000, 0);

            // Increase start-up time to render
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            pmremGenerator.compileEquirectangularShader();

            viewerDiv.appendChild(renderer.domElement);

            return renderer;
        }

        function createExtent() {
            let extentCoord1 = new itowns.Coordinates(centerCoord.crs, centerCoord.x - extentSize, centerCoord.y - extentSize);
            let extentCoord2 = new itowns.Coordinates(centerCoord.crs, centerCoord.x + extentSize, centerCoord.y + extentSize);

            extentCoord1 = extentCoord1.as(viewExtentEPSG);
            extentCoord2 = extentCoord2.as(viewExtentEPSG);

            viewExtent = new itowns.Extent(
                viewExtentEPSG,
                extentCoord1.x, extentCoord2.x,
                extentCoord1.y, extentCoord2.y
            );
        }

        async function loadView() {
            createExtent();

            const rootObj = new THREE.Object3D();
            rootObj.name = "iTownsViewRoot";
            rootObj.rotateX(-90 * THREE.MathUtils.DEG2RAD);

            const objChild = new THREE.Object3D();
            objChild.name = "pivot";
            objChild.position.copy(new THREE.Vector3(-centerCoord.x, -centerCoord.y, -centerCoord.z));
            rootObj.add(objChild);

            scene.add(rootObj);

            const geometry = new THREE.SphereGeometry(1, 32, 16);
            const material = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const sphere = new THREE.Mesh(geometry, material);
            pivot = sphere;
            scene.add(pivot);

            view = new itowns.PlanarView(
                viewerDiv,
                viewExtent,
                {
                    camera: { cameraThree: customCamera },
                    renderer: customRenderer,
                    scene3D: scene,
                    noControls: true,
                    object3d: objChild
                });

            view.tileLayer.object3d.geoidHeight = 200;
            view.tileLayer.disableSkirt = true;
            view.tileLayer.opacity = settings.opacity;

            customRenderer.setClearColor(0x000000, 0);
            window.view = view;
            debugMenu = new GuiTools('menuDiv', view);

            await loadPointCloud();
            await loadOrtho();
            await loadElevation();
            await loadGeoTiff();
            onAllLoaded();
        }

        async function loadElevation() {
            // Define the source of the dem data
            const sourceDEM = new itowns.WMSSource({
                url: "https://data.geopf.fr/wms-r/wms?",
                name: "ELEVATION.ELEVATIONGRIDCOVERAGE.HIGHRES",
                format: "image/x-bil;bits=32",
                crs: 'EPSG:2154',
                extent: viewExtent,
            });
            // Create the dem ElevationLayer and add it to the view
            layerDEM = new itowns.ElevationLayer('Elevation', { source: sourceDEM });
            await view.addLayer(layerDEM);
        }

        async function loadOrtho() {
            let sourceMap = null;
            switch (settings.imageSourceType) {
                case IMAGE_SOURCE_TYPE.SATELLITE:
                    sourceMap = new itowns.WMSSource({
                        url: "https://data.geopf.fr/wms-r/wms?",
                        name: "HR.ORTHOIMAGERY.ORTHOPHOTOS",
                        format: "image/png",
                        crs: orthoEPSG,
                        extent: viewExtent
                    });
                    break;
                case IMAGE_SOURCE_TYPE.IGN_PLANV2:
                    sourceMap = new itowns.WMSSource({
                        url: "https://data.geopf.fr/wms-r/wms?",
                        name: "GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2",
                        format: "image/jpeg",
                        crs: orthoEPSG,
                        extent: viewExtent
                    });
                    break;
            }

            if (sourceMap == null) {
                console.error("Source is null !");
                return;
            }

            // Create the ortho-images ColorLayer and add it to the view
            layerOrtho = new itowns.ColorLayer('Fond de carte', { source: sourceMap })
            await view.addLayer(layerOrtho);
        }

        async function loadPointCloud() {
            const pointCloudGroup = new THREE.Group();
            pointCloudGroup.name = "PointCloudGroup";

            const source = new itowns.CopcSource({ url: "https://raw.githubusercontent.com/bloc-in-bloc/sample-datas/main/copc/demo_fountain_3947.copc.laz" });
            const pointCloudLayer = new itowns.CopcLayer('points_cloud', {
                object3d: pointCloudGroup,
                source: source,
                crs: 'EPSG:3947'
            });

            await source.whenReady;
            view.tileLayer.object3d.add(pointCloudGroup);
            await itowns.View.prototype.addLayer.call(view, pointCloudLayer);
            return pointCloudLayer;
        }

        async function loadGeoTiff() {
            const sourceTiff = new COGSource({
                url: "https://raw.githubusercontent.com/bloc-in-bloc/sample-datas/main/cog/exemple_cog_200m.tif",
                name: "Enedis",
                crs: 'EPSG:3947',
                extent: viewExtent
            });

            layerGeoTiff = new itowns.ColorLayer('GeoTiff', { source: sourceTiff });

            await view.addLayer(layerGeoTiff);
        }

        function onAllLoaded() {
            const bbox = new THREE.Box3();
            bbox.setFromCenterAndSize(new THREE.Vector3(0,0,0), new THREE.Vector3(extentSize,extentSize,extentSize));
            const boundingSphere = bbox.getBoundingSphere(new THREE.Sphere());
            controls.fitToSphere(boundingSphere, false);
            controls.rotate(0, 70 * THREE.MathUtils.DEG2RAD, false);

            debugMenu.fixElevation = function () {
                console.log("Fix Elevation");
                const node = view.tileLayer.level0Nodes[0];
                const elevation = centerCoord.z;
                node.setBBoxZ({ min: elevation, max: elevation });
                node.updateMatrixWorld();
                view.notifyChange(customCamera);
            };

            debugMenu.gui.add(settings, 'imageSourceType', IMAGE_SOURCE_TYPE).name('Image source').onChange(changeSourceImage);
            debugMenu.gui.add(debugMenu, 'fixElevation').name('Fix elevation');
        }

        function changeSourceImage() {
            settings.imageSourceType = parseInt(settings.imageSourceType);
            view.removeLayer('Fond de carte');
            loadOrtho();
        }
    </script>
</body>

</html>
